    <script>
      // 本地镜像说明：原站的排行榜 / 联机服务不包含在此静态镜像中，
      // 这里拦截这两个接口，让界面以空榜与单人模式优雅降级。
      (() => {
        const nativeFetch = window.fetch;
        const json = (body, status = 200) =>
          Promise.resolve(new Response(JSON.stringify(body), {
            status,
            headers: { "content-type": "application/json" },
          }));
        window.fetch = (input, init = {}) => {
          const url = typeof input === "string" ? input : (input && input.url) || "";
          if (url.startsWith("/api/presence")) return json({ count: 1, best: 0 });
          if (url.startsWith("/api/leaderboard")) {
            const method = (init.method || "GET").toUpperCase();
            if (method === "POST") {
              return json({
                ok: false,
                message: "这是一份静态镜像，排行榜已停用。所有分数只留在本地。",
              });
            }
            return json({ top: [], count: 0 });
          }
          return nativeFetch(input, init);
        };
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-BY2CcXjY.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/kit-DsD4Rc8o.js">
    <link rel="modulepreload" crossorigin href="./assets/hails-DeolUH4Z.js">
    <link rel="stylesheet" crossorigin href="./assets/index-DHKFK6Tp.css">
  </head>
  <body>
    <canvas id="gl"></canvas>

    <!-- the gallery: a dark wall with the live painting hanging on it -->
    <div id="gallery">
      <div id="wall"></div>
      <div id="frame-shadow"></div>
      <div id="frame"></div>
      <div id="frame-lip"></div>
      <div id="plaque">
        <h1>星夜骑手</h1>
        <p class="sub">致敬文森特·梵高 &middot; <em>星月夜</em>，1889</p>
        <button id="enter" type="button">走进画中</button>
        <button id="open-board" type="button">排行榜</button>
      </div>
      <a id="handle" href="https://x.com/ebbyamir" target="_blank" rel="noopener">@ebbyamir</a>
    </div>

    <div id="hud" class="hidden">
      <div id="stars"><span class="glyph">✦</span><span id="star-count">0</span><span id="mult"></span></div>
      <div id="bank"><span id="bank-count">0</span> 颗已送达</div>
      <div id="hyper"><div id="hyper-fill"></div></div>
      <div id="trick"><span id="trick-name"></span><span id="trick-points"></span></div>
      <div id="brief">
        <p class="lead">尽可能多地收集光球<br />把它们送进教堂尖塔。</p>
      </div>
      <div id="finish">
        <p>已送达 <strong id="finish-score">0</strong> 颗。今晚就骑到这里？</p>
        <div class="row">
          <button id="finish-yes" type="button">结束游戏</button>
          <button id="finish-no" type="button">继续骑行</button>
        </div>
        <p class="keys for-keys"><kbd>Enter</kbd> 结束游戏</p>
      </div>
      <div id="riders"><span class="dot"></span><span id="riders-count">1</span><span id="riders-label">位骑手在画中</span><span id="riders-best"></span></div>
      <div id="guide">
        <span id="guide-arrow">↑</span>
        <span id="guide-label">教堂尖塔</span>
        <span id="guide-dist"></span>
      </div>
      <div id="hint">
        <!-- the keys, where they lie on the keyboard -->
        <div class="kb-row kb-top">
          <kbd data-code="KeyW"><b>W</b><i>蹬踏</i></kbd>
          <kbd data-code="KeyE"><b>E</b><i>特技</i></kbd>
          <kbd data-code="KeyR"><b>R</b><i>交谈</i></kbd>
          <kbd data-code="KeyT"><b>T</b><i>影院</i></kbd>
        </div>
        <div class="kb-row kb-home">
          <kbd data-code="KeyA"><b>A</b><i>左转</i></kbd>
          <kbd data-code="KeyS"><b>S</b><i>刹车</i></kbd>
          <kbd data-code="KeyD"><b>D</b><i>右转</i></kbd>
          <kbd data-code="KeyF"><b>F</b><i>下车</i></kbd>
          <kbd data-code="Enter" class="enter"><b>Enter</b><i>聊天</i></kbd>
        </div>
        <div class="kb-row kb-space">
          <kbd data-code="Space" class="space"><b>Space</b><i>跳跃 &nbsp;·&nbsp; 连按 3 次起飞</i></kbd>
        </div>
      </div>
      <div id="pad">
        <div id="stick"><div id="stick-knob"></div></div>
        <!-- how the stick is used, shown on a phone's first rides: a ghost of it, worked by an unseen thumb -->
        <div id="stick-demo" aria-hidden="true"><div class="ring"><div class="knob"></div></div></div>
        <button id="pad-jump" type="button">跳跃</button>
      </div>
      <div id="corner">
        <button id="btn-chat" type="button" title="和附近的骑手说点什么（Enter）">✎</button>
        <button id="btn-theater" type="button" title="影院模式：隐藏界面，专心骑行（T）">☾</button>
        <button id="btn-walk" type="button" title="下车步行／重新上车（F）">⇅</button>
        <button id="btn-sound" type="button" title="声音（M）">♪</button>
        <button id="btn-gallery" type="button" title="回到画廊（Esc）">▢</button>
      </div>
      <!-- lines said by the riders nearby, each over whoever said it; and the box a line is typed in -->
      <div id="bubbles"></div>
      <!-- beside one of the townsfolk: who can be spoken to -->
      <button id="talk-tip" type="button"><kbd>R</kbd><span id="talk-who">交谈</span></button>
      <form id="chat" autocomplete="off">
        <input id="chat-input" name="line" maxlength="90" spellcheck="false" autocapitalize="sentences" enterkeyhint="send" placeholder="和附近的骑手说点什么…" />
      </form>
      <div id="map"></div>
      <div id="toast"></div>
    </div>

    <!-- the leaderboard: the score just ridden, a field for an X handle, the table -->
    <div id="board" class="hidden">
      <div class="card">
        <h2 id="board-title">排行榜</h2>
        <div id="board-you">
          <p class="score">本次得分 <strong id="board-score">0</strong></p>
          <form id="board-form" autocomplete="off">
            <label for="board-handle">@</label>
            <input id="board-handle" name="handle" maxlength="16" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="你的 X 账号" />
            <button id="board-post" type="submit">发布分数</button>
          </form>
        </div>
        <p id="board-msg"></p>
        <ol id="board-list"></ol>
        <p id="board-empty" class="hidden">还没有人发布分数，来当第一个。</p>
        <p id="board-count"></p>
        <div class="row">
          <button id="board-again" type="button">再骑一圈</button>
          <button id="board-back" type="button">关闭</button>
        </div>
      </div>
    </div>

    <!-- another canvas (see src/portals/): hung on a wall of its own, with its plaque; then the game played in it, and how it went -->
    <div id="portal" class="hidden">
      <div id="p-card">
        <div id="p-wall"></div>
        <div id="p-shadow"></div>
        <div id="p-frame"></div>
        <div id="p-lip"></div>
        <div id="p-plaque">
          <h2 id="p-title"></h2>
          <p class="sub" id="p-sub"></p>
          <p class="how" id="p-how"></p>
          <div class="row">
            <button id="p-play" type="button">开始</button>
            <button id="p-back" type="button">回到小镇</button>
          </div>
          <p class="best" id="p-best"></p>
        </div>
      </div>
      <div id="p-hud">
        <div id="p-score"><span class="glyph">✦</span><span id="p-points">0</span><span id="p-lives"></span></div>
        <div id="p-clock"></div>
        <div id="p-note"></div>
        <div id="p-custom"></div>
        <div id="p-labels"></div>
        <button id="p-leave" type="button" title="回到小镇（Esc）">▢</button>
      </div>
      <div id="p-result">
        <div class="card">
          <h2 id="p-r-title"></h2>
          <p class="score"><strong id="p-r-score">0</strong></p>
          <p id="p-r-lines"></p>
          <p id="p-r-best"></p>
          <p id="p-r-reward"></p>
          <div class="row">
            <button id="p-again" type="button">再玩一次</button>
            <button id="p-done" type="button">回到小镇</button>
          </div>
        </div>
      </div>
    </div>

    <div id="loading"><div class="pulse"></div><span>正在调色…</span></div>
    <div id="fatal" class="hidden"></div>

  </body>
