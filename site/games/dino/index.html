    <script>
      // The original game talks to a remote scoreboard. This mirror keeps the
      // board fully on-device so the page never calls the author's API.
      (() => {
        const KEY = "dino-local-board-v1";
        const realFetch = window.fetch.bind(window);

        const readRows = () => {
          try {
            const rows = JSON.parse(localStorage.getItem(KEY) || "[]");
            return Array.isArray(rows)
              ? rows.filter((row) => row && typeof row.name === "string" && Number.isFinite(row.ms))
              : [];
          } catch {
            return [];
          }
        };
        const sortRows = (rows) => rows.slice().sort((a, b) => b.ms - a.ms);
        const reply = (payload) =>
          Promise.resolve(
            new Response(JSON.stringify(payload), {
              headers: { "Content-Type": "application/json" },
            }),
          );

        window.fetch = (input, init) => {
          let url;
          try {
            const raw = typeof input === "string" ? input : input && input.url;
            url = new URL(raw || "", location.href);
          } catch {
            return realFetch(input, init);
          }
          if (!url.pathname.endsWith("/api/scores")) return realFetch(input, init);

          const method = String((init && init.method) || (input && input.method) || "GET").toUpperCase();
          const rows = readRows();

          if (method === "GET") {
            return reply({ top: sortRows(rows).slice(0, 8).map(({ name, ms }) => ({ name, ms })) });
          }

          if (method === "POST") {
            let body = {};
            try {
              body = JSON.parse((init && init.body) || "{}");
            } catch {}
            const name = String(body.name || "").trim();
            const ms = Number(body.ms);
            if (!/^[\p{L}\p{N}]{2,16}$/u.test(name)) return reply({ error: "name" });
            if (!Number.isFinite(ms) || ms < 0) return reply({ error: "score" });

            const existing = rows.find((row) => row.name === name);
            let best = ms;
            if (existing) {
              if (ms > existing.ms) existing.ms = ms;
              best = existing.ms;
            } else {
              rows.push({ name, ms });
            }
            const ranked = sortRows(rows).slice(0, 50);
            try {
              localStorage.setItem(KEY, JSON.stringify(ranked));
            } catch {}
            const rank = ranked.findIndex((row) => row.name === name) + 1;
            return reply({
              top: ranked.slice(0, 8).map(({ name: rowName, ms: rowMs }) => ({ name: rowName, ms: rowMs })),
              rank: rank || 1,
              best,
              name,
            });
          }

          return reply({ error: "offline" });
        };
      })();
    </script>
