  @keyframes lbreathe { from { opacity: 0.86; } to { opacity: 1; } }
  #slot { position: relative; height: 56px; width: 100%; display: flex; align-items: center; justify-content: center; }
  #rank { display: flex; gap: 5px; transition: opacity 0.9s ease; }
  #rank i { display: block; position: relative; width: 26px; height: 26px; box-sizing: border-box; border: 1px solid rgba(176,152,104,0.7); background: rgba(10,7,4,0.6); overflow: hidden; }
  #rank i::before { content: ""; position: absolute; inset: 0; transform-origin: left center; transform: scaleX(var(--f, 0)); background: #e6d9ba; transition: transform 0.3s linear; }
  #rank i:nth-child(even)::before { background: #8d6c3c; }
  #rank i.now { animation: lnow 1.8s ease-in-out infinite; }
  @keyframes lnow { 0%, 100% { box-shadow: 0 0 0 rgba(232,200,136,0); border-color: rgba(160,138,92,0.5); } 50% { box-shadow: 0 0 12px rgba(232,200,136,0.55); border-color: rgba(232,200,136,0.95); } }
  #pct { font-size: 11px; letter-spacing: 0.24em; color: #8f8573; margin-top: 8px; height: 13px; padding-left: 0.24em; transition: opacity 0.9s ease; font-variant-numeric: tabular-nums; }
  #note { font-size: 11px; letter-spacing: 0.16em; color: #7d7464; margin-top: 12px; height: 13px; white-space: nowrap; }
  .touch #note .kb { display: none; }
  #title.loading #start, #title.failed #start { opacity: 0; pointer-events: none; }
  #title.ready #rank, #title.ready #pct, #title.ready #loadtxt { opacity: 0; }
  #title.failed #rank { opacity: 0.25; } #title.failed #pct { opacity: 0; } #title.failed #rank i.now { animation: none; }
  @media (prefers-reduced-motion: reduce) { #loadbg i, #rank i.now { animation: none; } #rank i::before { transition: none; } #loadbg { transition: opacity 0.6s linear; } #loadtxt { transition: none !important; } }
  #title { z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: calc(max(7vh, env(safe-area-inset-bottom)) + 136px + 3.2vh); box-sizing: border-box; pointer-events: auto; text-align: center;
    background: linear-gradient(to bottom, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.0) 26%, rgba(0,0,0,0.0) 48%, rgba(0,0,0,0.8) 66%, rgba(0,0,0,0.88) 100%); transition: opacity 1.8s ease; }
  #title .orig { font-family: "Cinzel Title", Cinzel, "Trajan Pro", "Palatino Linotype", Palatino, Georgia, serif; font-weight: 900; font-size: clamp(10px, 1.1vw, 14px); line-height: 1; letter-spacing: 0.5em; padding-left: 0.5em; color: #a08a5c; margin-bottom: 12px; white-space: nowrap; }
  #title h1 { font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "Cinzel Title", Cinzel, "Palatino Linotype", Palatino, Georgia, serif; font-weight: 700; font-size: clamp(30px, 7.2vw, 132px); line-height: 1.05; letter-spacing: 0.1em; margin: 0 0 0 0.1em; color: #f0e2c4; white-space: nowrap; }
  #title .foot { position: absolute; bottom: max(7vh, env(safe-area-inset-bottom)); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  #start { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); transition: opacity 1.1s ease 0.3s; white-space: nowrap; font: inherit; font-size: 18px; letter-spacing: 0.4em; padding: 15px 46px 15px 52px; color: #fbf3e0; background: rgba(10,7,4,0.72); border: 1px solid #a08a5c; cursor: pointer; }
  #start:hover { background: rgba(90,60,24,0.75); border-color: #e8c888; }
  #start:disabled { opacity: 0.6; cursor: default; }
  #loadtxt { font-size: 14px; font-style: italic; letter-spacing: 0.08em; color: #b9ad94; margin-top: 12px; height: 18px; white-space: nowrap; transition: opacity 0.7s ease; }
  #prompt { z-index: 4; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 13vh; font-size: 17px; letter-spacing: 0.12em; color: #d9cba9; text-shadow: 0 0 8px #000, 0 0 2px #000; opacity: 0; transition: opacity 0.35s; }
  #sub { z-index: 4; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6vh; font-size: 15px; font-style: italic; letter-spacing: 0.06em; color: #b9ad94; text-shadow: 0 0 6px #000, 0 0 2px #000; opacity: 0; transition: opacity 0.6s; }
  #status { z-index: 4; display: flex; align-items: flex-start; justify-content: center; padding-top: 7vh; font-size: 22px; letter-spacing: 0.5em; font-style: italic; color: #e4d3ad; text-shadow: 0 0 12px #000; opacity: 0; transition: opacity 1.2s; }
  #read { z-index: 6; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.4s; }
  #read div { max-width: min(560px, 80vw); padding: 26px 34px; background: rgba(8,6,4,0.82); border: 1px solid #4a3f2e; text-align: center; }
  #read h3 { font-weight: normal; font-style: italic; font-size: 14px; letter-spacing: 0.14em; color: #8f8573; margin: 0 0 14px; }
  #read p { font-size: clamp(15px, 2.4vh + 6px, 20px); line-height: 1.6; margin: 0; white-space: pre-line; color: #e2d6bd; }
  #end { z-index: 12; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; opacity: 0; transition: opacity 3s; }
  #end.white { background: #e9e6df; color: #2a2620; }
  #end h1 { font-weight: normal; letter-spacing: 0.3em; font-size: clamp(22px, 4vw, 54px); margin: 0 0 26px 0.3em; }
  #end p { font-size: clamp(14px, 2vw, 19px); line-height: 1.9; max-width: 640px; margin: 0 20px; font-style: italic; }
  #end small { margin-top: 40px; font-size: 13px; letter-spacing: 0.2em; opacity: 0.7; pointer-events: auto; }
  #dot { z-index: 3; display: flex; align-items: center; justify-content: center; } #dot i { width: 3px; height: 3px; border-radius: 50%; background: rgba(230,215,180,0.55); }
  #mute { position: fixed; right: max(16px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top)); z-index: 11; pointer-events: auto; font: inherit; font-size: 12px; letter-spacing: 0.2em; color: #b8ab90; background: rgba(0,0,0,0.4); border: 1px solid #5a4e3a; padding: 6px 10px; cursor: pointer; }
  #help { position: fixed; left: max(18px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); z-index: 4; font-size: 13px; letter-spacing: 0.08em; color: #b8ab90; line-height: 1.8; opacity: 0; transition: opacity 2s; text-shadow: 0 0 6px #000, 0 0 2px #000; pointer-events: none; }
  #nogl, #rotate { display: none; position: fixed; inset: 0; z-index: 20; background: #000 url(og.jpg) center/cover no-repeat; align-items: flex-end; justify-content: center; }
  #rotate { background: rgba(0,0,0,0.62); align-items: center; z-index: 30; pointer-events: auto; }
  #rotate div { margin: 0 24px; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  html, body { -webkit-tap-highlight-color: transparent; position: fixed; inset: 0; width: 100%; }
  .touch #mute { padding: 12px 14px; }
  /* phones: a small "more" button beside the sound switch opens a one-item menu; beginning again takes that tap, then two more */
  #more { display: none; position: fixed; right: calc(max(16px, env(safe-area-inset-right)) + 128px); top: max(14px, env(safe-area-inset-top)); z-index: 11; pointer-events: auto; font: inherit; font-size: 12px; letter-spacing: 0.2em; color: #b8ab90; background: rgba(0,0,0,0.4); border: 1px solid #5a4e3a; padding: 12px 13px 12px 15px; }
  #menu { display: none; position: fixed; right: max(16px, env(safe-area-inset-right)); top: calc(max(14px, env(safe-area-inset-top)) + 52px); z-index: 11; pointer-events: auto; }
  #again { font: inherit; font-size: 12px; letter-spacing: 0.2em; color: #d8cdb8; background: rgba(8,6,4,0.86); border: 1px solid #5a4e3a; padding: 14px 16px; min-width: 190px; }
  #again.sure { color: #fbf3e0; border-color: #c9a86a; background: rgba(60,36,12,0.9); }
  .touch.playing #more { display: block; } .touch.playing #menu.open { display: block; }
  .touch #act { min-width: 132px; min-height: 56px; font-size: 16px; }
  .touch #help { font-size: 12px; max-width: 60vw; left: max(18px, env(safe-area-inset-left)); bottom: auto; top: max(12px, env(safe-area-inset-top)); line-height: 1.6; }
  .touch #dot { display: none; }
  .touch #prompt { padding-bottom: 9vh; font-size: 15px; }
  .touch #start { padding: 17px 50px 17px 56px; }
  @media (max-height: 480px) { #title { padding-bottom: calc(max(5vh, env(safe-area-inset-bottom)) + 128px + 2vh); } #title h1 { font-size: clamp(24px, 6.3vw, 124px); } #title .foot { bottom: max(5vh, env(safe-area-inset-bottom)); } #read div { padding: 16px 22px; } #end h1 { margin-bottom: 12px; } #end small { margin-top: 16px; } }
  #nogl div, #rotate div { background: rgba(0,0,0,0.8); padding: 22px 26px; margin: 0 0 8vh; max-width: 520px; text-align: center; font-size: 17px; line-height: 1.6; }
