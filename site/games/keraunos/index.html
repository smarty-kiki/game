    background: linear-gradient(90deg, rgba(4,7,11,.55), rgba(4,7,11,.38)); box-shadow: inset 0 0 0 1px rgba(232,236,239,.24); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: box-shadow .12s, background .12s; }
