      // Turn after turn of a little work: while they follow one another the page is never idle and the clock stands.
      // When it is behind, a turn rests instead: the clock leaps to the next timer, which is the fence below, at
      // most 8 ms on, and the fence starts the turns again.
      port.port1.onmessage = function () {
        for (var i = 0; i < 2e4; i++) x += Math.sqrt(i);
        if (over) return;
        turns++;
        if (behind()) resting = true; else port.port2.postMessage(x > 0 ? 0 : 1);
      };
      (function fence() {
        if (over) return;
        setTimeout(fence, 8);
        if (resting) { resting = false; port.port2.postMessage(0); }
      })();
      port.port2.postMessage(0);
    })();
  </script>
  <script type="module">
    // The ride. (Development only: ?uistub=1 on a development host puts the interface over a still picture or a
    // flat colour instead, with no ride behind it, for photographing and measuring it: src/ui.js, stubEngine.)
    const q = new URLSearchParams(location.search);
    if (q.has('uistub') && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      const ui = await import('./src/ui.js');
      ui.initUI(await ui.stubEngine(document.getElementById('view'), q), { dev: true });
    } else {
      // (a part of the ride that did not arrive, or a browser that cannot read it: said on the opening card)
      try { await import('./src/main.js'); } catch (err) { console.error(err); if (window.__opening) window.__opening.fail(err); }
    }
  </script>
