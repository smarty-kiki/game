    <style>html,body{background:#0b0d10;height:100%;margin:0;overflow:hidden}#view{outline:none;width:100%;height:100%;display:block;position:fixed;inset:0}#boot{z-index:20;color:#fffffff0;background:#0b0d10;place-items:center;font-family:Jost Variable,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans SC,Segoe UI,system-ui,sans-serif;transition:opacity .9s;display:grid;position:fixed;inset:0}#boot.gone{opacity:0;pointer-events:none}#boot div{width:min(360px,70vw)}#boot svg{width:58px;height:58px;margin:0 0 4px -4px;animation:2.6s ease-in-out infinite bootmark;display:block}@keyframes bootmark{0%,to{opacity:.55}50%{opacity:1}}#boot h1{letter-spacing:.01em;margin:0 0 18px;font-family:Josefin Sans Variable,Century Gothic,PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans SC,Segoe UI Light,Segoe UI,sans-serif;font-size:38px;font-weight:200}#boot .bar{background:#ffffff29;height:1px;margin-left:5px;position:relative}#boot .bar:before{content:"";background:#e7c27d;width:7px;height:7px;position:absolute;top:-3px;left:-5px;transform:rotate(45deg)}#boot .bar i{transform-origin:0;background:#e7c27d;transition:transform .5s cubic-bezier(.2,.7,.2,1);position:absolute;inset:0;transform:scaleX(.02)}#boot p{color:#ffffff9e;margin:16px 0 0;font-size:14px}#boot p.tip{color:#fff6;min-height:2.9em;margin-top:30px;font-size:13.5px;line-height:1.45}</style>
